name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@a39e78ca5d2b36bd09b878a1b6f48a6e61d9302d"
      - run: python -m pip install -e ".[test]" build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: vllm-hust-ext extension inspect org.vllm-hust.stateaxis-pipelined-weight-loading
      - run: python tools/benchmark_evidence.py --destination "$RUNNER_TEMP/benchmark-evidence" --path evidence/ecpa-contract-20261011/manager-config.json
      - run: VLLM_HUST_EXT_CONFIG="$RUNNER_TEMP/benchmark-evidence/evidence/ecpa-contract-20261011/manager-config.json" vllm-hust-ext extension check org.vllm-hust.stateaxis-pipelined-weight-loading
      - run: VLLM_HUST_EXT_CONFIG="$RUNNER_TEMP/benchmark-evidence/evidence/ecpa-contract-20261011/manager-config.json" vllm-hust-ext extension plan org.vllm-hust.stateaxis-pipelined-weight-loading
      - run: VLLM_HUST_EXT_CONFIG="$RUNNER_TEMP/benchmark-evidence/evidence/ecpa-contract-20261011/manager-config.json" vllm-hust-ext run --dry-run -- /bin/true
